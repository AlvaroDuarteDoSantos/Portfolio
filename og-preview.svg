<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627">
  <defs>
    <!-- Background Gradients & Blobs -->
    <radialGradient id="bgGlow1" cx="15%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#060813" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bgGlow2" cx="85%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#060813" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bgGlow3" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#060813" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Borders & Highlights -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Logo Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="627" fill="#060813" />

  <!-- Ambient Fluid Light Blobs -->
  <rect width="1200" height="627" fill="url(#bgGlow1)" />
  <rect width="1200" height="627" fill="url(#bgGlow2)" />
  <rect width="1200" height="627" fill="url(#bgGlow3)" />

  <!-- Grid mesh overlay -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="627" stroke-dasharray="4,8" />
    <line x1="300" y1="0" x2="300" y2="627" stroke-dasharray="4,8" />
    <line x1="500" y1="0" x2="500" y2="627" stroke-dasharray="4,8" />
    <line x1="700" y1="0" x2="700" y2="627" stroke-dasharray="4,8" />
    <line x1="900" y1="0" x2="900" y2="627" stroke-dasharray="4,8" />
    <line x1="1100" y1="0" x2="1100" y2="627" stroke-dasharray="4,8" />
    <line x1="0" y1="120" x2="1200" y2="120" stroke-dasharray="4,8" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke-dasharray="4,8" />
    <line x1="0" y1="480" x2="1200" y2="480" stroke-dasharray="4,8" />
  </g>

  <!-- Center Liquid Glass Hero Card -->
  <rect x="100" y="75" width="1000" height="477" rx="28" fill="#0d1326" fill-opacity="0.6" stroke="url(#glassBorder)" stroke-width="2" filter="url(#cardShadow)" />

  <!-- Top Status Badge -->
  <g transform="translate(160, 130)">
    <rect width="320" height="38" rx="19" fill="#06b6d4" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="20" cy="19" r="5" fill="#22d3ee" />
    <text x="35" y="24" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="14" font-weight="600" fill="#67e8f9" letter-spacing="0.5">DEV OPS &amp; CLOUD ARCHITECT</text>
  </g>

  <!-- Logo Badge inside Card -->
  <g transform="translate(930, 120)">
    <rect width="90" height="90" rx="22" fill="url(#logoGrad)" />
    <text x="45" y="52" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="central">AD</text>
  </g>

  <!-- Name & Title -->
  <text x="160" y="245" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="64" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">Álvaro Duarte</text>
  <text x="160" y="300" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="28" font-weight="600" fill="#f1f5f9">DevOps &amp; Cloud Engineer</text>
  <text x="160" y="338" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">Kubernetes • GCP • Azure • Terraform • CI/CD • HPC UPV</text>

  <!-- Tech Tags Row -->
  <g transform="translate(160, 395)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="40" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="65" y="25" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500" fill="#7dd3fc" text-anchor="middle">Kubernetes</text>

    <!-- Pill 2 -->
    <rect x="145" y="0" width="120" height="40" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="205" y="25" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500" fill="#7dd3fc" text-anchor="middle">Terraform</text>

    <!-- Pill 3 -->
    <rect x="280" y="0" width="120" height="40" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="340" y="25" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500" fill="#7dd3fc" text-anchor="middle">GCP Cloud</text>

    <!-- Pill 4 -->
    <rect x="415" y="0" width="140" height="40" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="485" y="25" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500" fill="#7dd3fc" text-anchor="middle">GitLab CI/CD</text>

    <!-- Pill 5 -->
    <rect x="570" y="0" width="110" height="40" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="625" y="25" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500" fill="#7dd3fc" text-anchor="middle">Python</text>
  </g>

  <!-- Bottom URL Pill -->
  <g transform="translate(160, 475)">
    <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="500" fill="#38bdf8">alvaroduartedosantos.github.io/Portfolio</text>
  </g>
</svg>
